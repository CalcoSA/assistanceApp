name: assistance-app-qa

services:
  backend:
    container_name: assistance-app-qa-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      ONLYOFFICE_PUBLIC_URL: /documentserver
      ONLYOFFICE_STORAGE_BASE_URL: http://backend:8000
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET no configurado}
    expose:
      - "8000"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    container_name: assistance-app-qa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

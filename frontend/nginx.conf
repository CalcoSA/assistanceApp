map $http_host $onlyoffice_current_host {
    "" $host;
    default $http_host;
}

map $http_x_forwarded_proto $onlyoffice_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $onlyoffice_forwarded_host {
    default $http_x_forwarded_host;
    "" $onlyoffice_current_host;
}

map $http_upgrade $onlyoffice_connection {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /documentserver/ {
        proxy_pass http://onlyoffice-documentserver/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $onlyoffice_connection;
        proxy_set_header X-Forwarded-Host $onlyoffice_forwarded_host/documentserver;
        proxy_set_header X-Forwarded-Proto $onlyoffice_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

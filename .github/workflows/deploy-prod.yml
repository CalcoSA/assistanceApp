name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      PROD_PATH: ${{ secrets.PROD_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production environment files
        shell: bash
        env:
          BACKEND_ENV_CONTENT: ${{ secrets.BACKEND_ENV_PROD }}
          ONLYOFFICE_JWT_SECRET_VALUE: ${{ secrets.ONLYOFFICE_JWT_SECRET_PROD }}
        run: |
          set -euo pipefail

          if [[ -z "$BACKEND_ENV_CONTENT" ]]; then
            echo "El secreto BACKEND_ENV_PROD no está configurado."
            exit 1
          fi

          if [[ -z "$ONLYOFFICE_JWT_SECRET_VALUE" ]]; then
            echo "El secreto ONLYOFFICE_JWT_SECRET_PROD no está configurado."
            exit 1
          fi

          printf '%s\n' "$BACKEND_ENV_CONTENT" > backend/.env

          {
            printf 'ONLYOFFICE_JWT_SECRET=%s\n' "$ONLYOFFICE_JWT_SECRET_VALUE"
            printf 'ONLYOFFICE_HOST_PORT=8086\n'
          } > .env

          chmod 600 backend/.env .env

      - name: Configure SSH
        shell: bash
        env:
          VM_SSH_KEY_VALUE: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY_VALUE" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Prepare production folders on VM
        shell: bash
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "mkdir -p '$PROD_PATH/backend/uploads' '$PROD_PATH/onlyoffice/logs' '$PROD_PATH/onlyoffice/data' '$PROD_PATH/onlyoffice/lib'"

      - name: Sync project to production
        shell: bash
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "backend/.venv" \
            --exclude "backend/uploads/" \
            --exclude "frontend/node_modules" \
            --exclude "frontend/dist" \
            --exclude "onlyoffice/logs/" \
            --exclude "onlyoffice/data/" \
            --exclude "onlyoffice/lib/" \
            ./ "$VM_USER@$VM_HOST:$PROD_PATH/"

      - name: Deploy production containers
        shell: bash
        run: |
          ssh "$VM_USER@$VM_HOST" bash -s -- "$PROD_PATH" <<'REMOTE_SCRIPT'
            set -euo pipefail

            DEPLOY_PATH="$1"
            cd "$DEPLOY_PATH"

            mkdir -p backend/uploads onlyoffice/logs onlyoffice/data onlyoffice/lib
            chmod 600 backend/.env .env

            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            elif command -v docker-compose >/dev/null 2>&1; then
              compose() { docker-compose "$@"; }
            else
              echo "Docker Compose no está disponible en la VM."
              exit 1
            fi

            compose --env-file .env \
              -f docker-compose.prod.yml \
              -f docker-compose.onlyoffice.yml \
              config >/dev/null

            compose --env-file .env \
              -f docker-compose.prod.yml \
              -f docker-compose.onlyoffice.yml \
              up -d --build --remove-orphans

            docker image prune -f
          REMOTE_SCRIPT
